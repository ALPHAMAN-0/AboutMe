<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>P2 — Phone hero dark</title>
<link rel="stylesheet" href="_tokens.css">
<style>
  body { padding: 32px; background: #0e0e0c; }
  .stage { width: 390px; height: 844px; margin: 0 auto; background: var(--ground); border-radius: 36px; overflow: hidden; position: relative; box-shadow: 0 30px 60px -30px rgba(0,0,0,0.5); color: var(--ink); }
  .notch { width: 110px; height: 28px; background: var(--ink); margin: 0 auto; border-radius: 0 0 18px 18px; }
  .frame { display: flex; flex-direction: column; height: 100%; }
  .topbar-mini { height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; }
  .menu-btn { width: 44px; height: 44px; border-radius: 12px; background: var(--tile); border: 1px solid var(--rule); display: grid; place-items: center; color: var(--ink); }
  .theme-btn { width: 44px; height: 44px; border-radius: 999px; background: var(--tile); border: 1px solid var(--rule); display: grid; place-items: center; color: var(--ink); }
  main { padding: 8px 18px 0; flex: 1; overflow: hidden; }
  .statusline { display: flex; align-items: center; gap: 8px; font: 500 12px var(--sans); color: var(--ink-2); margin-top: 8px; }
  .statusline .dot { width: 8px; height: 8px; border-radius: 999px; background: #2DA66A; }
  h1 { font-family: var(--serif); font-variation-settings: "opsz" 144, "wght" 380; font-size: 56px; line-height: 0.95; letter-spacing: -0.02em; margin: 18px 0 6px; font-weight: 380; color: var(--ink); }
  h1 em { font-style: italic; font-weight: 400; }
  .role { font: 500 14px var(--sans); color: var(--ink-2); margin: 0 0 14px; }
  .summary { font-size: 14px; color: var(--ink-2); line-height: 1.5; max-width: 30ch; }
  .btns { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
  .btn { display: inline-flex; align-items: center; gap: 6px; height: 44px; padding: 0 16px; border-radius: 999px; font: 600 13px var(--sans); background: var(--ink); color: var(--ground); border: 0; }
  .btn--ghost { background: transparent; color: var(--ink); border: 1px solid var(--rule); }
  .photo { width: 56px; height: 56px; border-radius: 999px; background: linear-gradient(180deg, #2a2924, #1a1916); border: 1px solid var(--rule); margin-top: 16px; display: inline-block; float: right; margin-left: 12px; }
  .spec { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--rule); border-radius: 14px; overflow: hidden; border: 1px solid var(--rule); margin-top: 22px; }
  .spec > div { background: var(--tile); padding: 14px; }
  .spec .k { font: 600 10px var(--mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); }
  .spec .v { font: 500 13px var(--sans); margin-top: 6px; color: var(--ink); }
  .spec .v a { color: var(--accent); text-decoration: none; }
  .actionbar { position: absolute; left: 0; right: 0; bottom: 16px; padding: 12px 18px; background: var(--tile); border: 1px solid var(--rule); border-radius: 18px; margin: 0 14px; display: flex; gap: 8px; align-items: center; justify-content: space-between; }
  .actionbar .ab-title { font: 500 12px var(--mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); padding-right: 12px; border-right: 1px solid var(--rule); }
  .actionbar .ab-btns { display: flex; gap: 6px; }
  .actionbar .pill { height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--rule); background: var(--tile); font: 600 12px var(--sans); color: var(--ink); display: inline-flex; align-items: center; }
  .pill--accent { background: var(--accent); color: #131311; border-color: transparent; }
  .anno { color: var(--ink-3); font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: 0.08em; position: absolute; left: 0; right: 0; top: -28px; text-align: center; }
</style>
</head>
<body>

</div>
</body>
</html>
