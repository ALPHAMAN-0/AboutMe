<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Siam Hossain — SH">
  <defs>
    <linearGradient id="sh-fill" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="64" y2="64">
      <stop offset="0" stop-color="#1F44E0"/>
      <stop offset="1" stop-color="#13245C"/>
    </linearGradient>
    <linearGradient id="sh-mark" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="64">
      <stop offset="0" stop-color="#FBFAF7"/>
      <stop offset="1" stop-color="#F4F2EC"/>
    </linearGradient>
    <radialGradient id="sh-glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Rounded square plate -->
  <rect x="2" y="2" width="60" height="60" rx="14" ry="14" fill="url(#sh-fill)"/>
  <rect x="2" y="2" width="60" height="60" rx="14" ry="14" fill="url(#sh-glow)"/>

  <!-- subtle grid for the "programmer window" feel -->
  <g stroke="#FBFAF7" stroke-opacity="0.08" stroke-width="0.5">
    <line x1="2" y1="18" x2="62" y2="18"/>
    <line x1="2" y1="32" x2="62" y2="32"/>
    <line x1="2" y1="46" x2="62" y2="46"/>
    <line x1="18" y1="2" x2="18" y2="62"/>
    <line x1="32" y1="2" x2="32" y2="62"/>
    <line x1="46" y1="2" x2="46" y2="62"/>
  </g>

  <!-- corner ticks (window-frame feel) -->
  <g stroke="#FBFAF7" stroke-opacity="0.35" stroke-width="1.4" stroke-linecap="round">
    <path d="M8 8 L8 14 M8 8 L14 8"/>
    <path d="M56 8 L56 14 M56 8 L50 8"/>
    <path d="M8 56 L8 50 M8 56 L14 56"/>
    <path d="M56 56 L56 50 M56 56 L50 56"/>
  </g>

  <!-- SH monogram -->
  <g fill="url(#sh-mark)" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-weight="700" font-size="26" text-anchor="middle">
    <text x="20" y="42">S</text>
    <text x="44" y="42">H</text>
  </g>

  <!-- terminal caret accent under the H -->
  <rect x="40" y="46" width="6" height="2" fill="#00FF41" opacity="0.9"/>
</svg>
